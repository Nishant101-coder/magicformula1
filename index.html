<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Magic Formula Live | GitHub Edition</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { background: #010409; color: #c9d1d9; font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; }
        .data-row:hover { background: rgba(56, 139, 253, 0.1); }
        .status-pill { padding: 2px 8px; border-radius: 12px; font-size: 11px; font-weight: bold; }
        .market-closed { background: #3e1c1c; color: #ff7b72; border: 1px solid #f85149; }
        .market-open { background: #112d1a; color: #7ee787; border: 1px solid #3fb950; }
    </script>
</head>
<body class="p-6 md:p-12">

    <div class="max-w-4xl mx-auto">
        <header class="flex justify-between items-center mb-8 border-b border-gray-800 pb-6">
            <div>
                <h1 class="text-2xl font-bold text-white tracking-tighter">MAGIC_FORMULA_<span class="text-blue-500">v2.0</span></h1>
                <p id="market-status" class="text-[10px] mt-2 uppercase tracking-widest text-gray-500">Market Status: Unknown</p>
            </div>
            <button onclick="runSync()" id="btn" class="bg-blue-600 hover:bg-blue-500 text-white px-6 py-2 rounded-md font-bold transition-all active:scale-95 shadow-lg shadow-blue-900/20">
                RUN ANALYSIS
            </button>
        </header>

        <div id="loader" class="hidden mb-6">
            <div class="flex justify-between text-[10px] mb-1 uppercase text-blue-400 font-bold">
                <span id="load-msg">Initializing Engine...</span>
                <span id="load-pct">0%</span>
            </div>
            <div class="w-full bg-gray-800 h-1 rounded-full overflow-hidden">
                <div id="bar" class="bg-blue-500 h-full w-0 transition-all duration-300"></div>
            </div>
        </div>

        <div class="border border-gray-800 rounded-lg overflow-hidden bg-[#0d1117]">
            <table class="w-full text-left text-sm">
                <thead class="bg-[#161b22] text-gray-500 text-[10px] uppercase font-black">
                    <tr>
                        <th class="p-4">Rank</th>
                        <th class="p-4">Ticker</th>
                        <th class="p-4">Yield</th>
                        <th class="p-4">ROC</th>
                        <th class="p-4 text-right">Magic Score</th>
                    </tr>
                </thead>
                <tbody id="results-table" class="divide-y divide-gray-800">
                    <tr><td colspan="5" class="p-20 text-center text-gray-600 italic">Ready for input. Click Run Analysis to scrape live data.</td></tr>
                </tbody>
            </table>
        </div>
    </div>

<script>
    const tickers = ["AAPL", "MSFT", "GOOGL", "AMZN", "META", "NVDA", "TSLA", "XOM", "JPM", "COST", "ORCL", "NFLX"];

    async function runSync() {
        const btn = document.getElementById('btn');
        const table = document.getElementById('results-table');
        const loader = document.getElementById('loader');
        const bar = document.getElementById('bar');
        const msg = document.getElementById('load-msg');
        const pct = document.getElementById('load-pct');

        btn.disabled = true;
        loader.classList.remove('hidden');
        table.innerHTML = "";
        
        let masterData = [];

        for (let i = 0; i < tickers.length; i++) {
            const symbol = tickers[i];
            msg.innerText = `SCRAPING ${symbol}...`;
            
            // Using AllOrigins Proxy + Cache Buster (timestamp) to bypass Yahoo blocks
            const proxy = `https://api.allorigins.win/get?url=${encodeURIComponent('https://query1.finance.yahoo.com/v7/finance/quote?symbols=' + symbol)}&_=${Date.now()}`;
            
            try {
                const response = await fetch(proxy);
                const json = await response.json();
                const data = JSON.parse(json.contents).quoteResponse.result[0];

                if (data) {
                    // Update market badge based on first ticker
                    if (i === 0) updateMarketBadge(data.marketState);

                    // Magic Formula Calculation
                    const eYield = data.trailingPE ? (100 / data.trailingPE) : 0;
                    const roc = data.bookValue ? (data.epsTrailingTwelveMonths / data.bookValue * 100) : 0;

                    masterData.push({
                        symbol,
                        yield: eYield,
                        roc: roc,
                        score: 0 
                    });
                }
            } catch (e) {
                console.error(`Failed: ${symbol}`);
            }

            const progress = Math.round(((i + 1) / tickers.length) * 100);
            bar.style.width = progress + "%";
            pct.innerText = progress + "%";
            
            // Slight delay to mimic human behavior
            await new Promise(r => setTimeout(r, 350));
        }

        // Calculate Magic Rankings
        masterData.sort((a, b) => b.yield - a.yield);
        masterData.forEach((s, i) => s.yRank = i + 1);
        masterData.sort((a, b) => b.roc - a.roc);
        masterData.forEach((s, i) => s.rRank = i + 1);
        masterData.forEach(s => s.finalScore = s.yRank + s.rRank);
        masterData.sort((a, b) => a.finalScore - b.finalScore);

        // Render Table
        table.innerHTML = masterData.map((s, i) => `
            <tr class="data-row transition-colors border-b border-gray-800">
                <td class="p-4 font-bold text-blue-500">#${i + 1}</td>
                <td class="p-4 font-bold text-white">${s.symbol}</td>
                <td class="p-4 text-green-400 font-bold">${s.yield.toFixed(2)}%</td>
                <td class="p-4 text-purple-400 font-bold">${s.roc.toFixed(2)}%</td>
                <td class="p-4 text-right font-black text-white">${s.finalScore}</td>
            </tr>
        `).join('');

        loader.classList.add('hidden');
        btn.disabled = false;
    }

    function updateMarketBadge(state) {
        const badge = document.getElementById('market-status');
        const isOpen = state === "REGULAR";
        badge.innerText = `Market Status: ${state} (${isOpen ? 'Live' : 'Last Close Data'})`;
        badge.className = `text-[10px] mt-2 uppercase tracking-widest font-black ${isOpen ? 'text-green-500' : 'text-red-500'}`;
    }
</script>
</body>
</html>
