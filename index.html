<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>QUANT_NODE // STABLE_STREAM_v3.2</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@500;800&display=swap');
        body { background: #010409; color: #c9d1d9; font-family: 'JetBrains Mono', monospace; }
        .panel { background: #0d1117; border: 1px solid #30363d; border-radius: 4px; }
        .loading-pulse { animation: pulse 2s cubic-bezier(0.4, 0, 0.6, 1) infinite; }
        @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: .5; } }
    </style>
</head>
<body class="p-4 md:p-12">

    <div class="max-w-4xl mx-auto">
        <header class="flex justify-between items-end mb-8 border-b border-[#30363d] pb-6">
            <div>
                <h1 class="text-white text-2xl font-bold tracking-tighter uppercase font-black italic">Terminal_<span class="text-blue-500">v3.2</span></h1>
                <p class="text-[10px] text-slate-500 mt-1 tracking-widest font-bold uppercase">Source: <span class="text-green-500">TwelveData_Verified</span></p>
            </div>
            <button onclick="startAnalysis()" id="runBtn" class="bg-blue-600 hover:bg-blue-500 text-white px-10 py-3 rounded font-black text-xs transition-all active:scale-95 shadow-lg shadow-blue-500/20">
                RUN_STABLE_SCAN
            </button>
        </header>

        <div class="mb-6">
            <div id="status" class="text-[10px] text-blue-400 font-bold uppercase tracking-widest mb-2">> System Standby...</div>
            <div class="w-full bg-[#161b22] h-1 rounded-full overflow-hidden">
                <div id="progress" class="h-full bg-blue-500 transition-all duration-500 w-0"></div>
            </div>
        </div>

        <div class="panel overflow-hidden shadow-2xl">
            <table class="w-full text-left text-[11px]">
                <thead class="bg-[#161b22] text-slate-400 border-b border-[#30363d] uppercase font-bold">
                    <tr>
                        <th class="p-4">Rank</th>
                        <th class="p-4">Ticker</th>
                        <th class="p-4">E_Yield (%)</th>
                        <th class="p-4">ROIC (%)</th>
                        <th class="p-4 text-right">Score</th>
                    </tr>
                </thead>
                <tbody id="grid" class="divide-y divide-[#30363d]">
                    <tr><td colspan="5" class="p-20 text-center text-slate-600 italic uppercase">Click button to execute high-integrity scan.</td></tr>
                </tbody>
            </table>
        </div>
    </div>

<script>
    const API_KEY = "4be8038df64e4e34abef0cda10e59327";
    // We will scan 5 major stocks to ensure we stay well within the free tier limits
    const TICKERS = ["AAPL", "MSFT", "NVDA", "GOOGL", "AMZN"];

    async function startAnalysis() {
        const btn = document.getElementById('runBtn');
        const grid = document.getElementById('grid');
        const status = document.getElementById('status');
        const progress = document.getElementById('progress');
        
        btn.disabled = true;
        btn.innerText = "SCANNING...";
        grid.innerHTML = "";
        
        let masterData = [];

        for (let i = 0; i < TICKERS.length; i++) {
            const symbol = TICKERS[i];
            const percent = ((i + 1) / TICKERS.length) * 100;
            
            status.innerHTML = `<span class="loading-pulse">> HANDSHAKING WITH DATA NODE: ${symbol}...</span>`;
            progress.style.width = `${percent}%`;

            try {
                // Using the 'Statistics' endpoint only - it contains both valuation and profitability
                const url = `https://api.twelvedata.com/statistics?symbol=${symbol}&apikey=${API_KEY}`;
                const response = await fetch(url);
                const data = await response.json();

                if (data.status === "error") throw new Error(data.message);

                const stats = data.statistics;
                const pe = parseFloat(stats.valuation_and_assets.forward_pe || stats.valuation_and_assets.trailing_pe);
                const roic = parseFloat(stats.profitability.return_on_invested_capital || stats.profitability.return_on_assets);

                const eYield = pe ? (100 / pe) : 0;

                if (eYield > 0 && roic > 0) {
                    masterData.push({ symbol, eYield, roic });
                    status.innerHTML = `<span class="text-green-500 font-bold">> ${symbol} VERIFIED</span>`;
                }

            } catch (err) {
                status.innerHTML = `<span class="text-red-500 font-bold">> ${symbol} BLOCKED: ${err.message}</span>`;
                console.error(err);
            }

            // High-security delay: 12 seconds to prevent IP-based throttling
            if (i < TICKERS.length - 1) {
                await new Promise(r => setTimeout(r, 12000));
            }
        }

        // Quant Ranking Engine
        masterData.sort((a, b) => b.eYield - a.eYield).forEach((s, i) => s.yRank = i + 1);
        masterData.sort((a, b) => b.roic - a.roic).forEach((s, i) => s.rRank = i + 1);
        masterData.forEach(s => s.score = s.yRank + s.rRank);
        masterData.sort((a, b) => a.score - b.score);

        if (masterData.length === 0) {
            grid.innerHTML = `<tr><td colspan="5" class="p-20 text-center text-red-500 font-bold uppercase">No data received. API limit likely exceeded for this hour.</td></tr>`;
        } else {
            grid.innerHTML = masterData.map((s, i) => `
                <tr class="hover:bg-blue-500/5 transition-all">
                    <td class="p-4 font-bold text-blue-500 italic">#${(i+1).toString().padStart(2, '0')}</td>
                    <td class="p-4 text-white font-bold tracking-widest">${s.symbol}</td>
                    <td class="p-4 text-green-400 font-bold">${s.eYield.toFixed(2)}%</td>
                    <td class="p-4 text-purple-400 font-bold">${s.roic.toFixed(2)}%</td>
                    <td class="p-4 text-right text-white font-black">${s.score}</td>
                </tr>
            `).join('');
        }

        btn.disabled = false;
        btn.innerText = "RUN_STABLE_SCAN";
        status.innerText = "> SCAN COMPLETED SUCCESSFULLY.";
    }
</script>
</body>
</html>
