<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QUANT_NODE // MAGIC_FORMULA_v2.6</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@500;800&display=swap');
        body { background: #010409; color: #8b949e; font-family: 'JetBrains Mono', monospace; }
        .terminal-panel { background: #0d1117; border: 1px solid #30363d; border-radius: 6px; }
        tr:hover { background: rgba(56, 139, 253, 0.03); }
        .loading-bar { height: 2px; background: #388bfd; transition: width 0.3s ease; }
    </style>
</head>
<body class="p-4 md:p-10">

    <div class="max-w-5xl mx-auto">
        <header class="flex justify-between items-center mb-8">
            <div>
                <h1 class="text-white text-xl font-bold tracking-tighter uppercase">Magic_Formula_Terminal</h1>
                <p class="text-[9px] text-slate-500 mt-1 uppercase tracking-widest">Auth_Status: <span class="text-green-500 font-bold">KEY_ENCRYPTED_LOADED</span></p>
            </div>
            
            <button onclick="runQuant()" id="btn" class="bg-blue-600 hover:bg-blue-500 text-white px-8 py-3 rounded text-[10px] font-black transition-all uppercase tracking-widest active:scale-95 shadow-lg shadow-blue-500/20">
                Execute_Scan
            </button>
        </header>

        <div id="status-bar" class="text-[9px] mb-4 text-slate-500">
            > SYSTEM_IDLE: STANDBY_FOR_COMMAND
        </div>

        <div class="w-full bg-[#161b22] h-[1px] mb-8">
            <div id="progress" class="loading-bar w-0"></div>
        </div>

        <div class="terminal-panel overflow-hidden shadow-2xl">
            <table class="w-full text-left text-[11px]">
                <thead class="bg-[#161b22] text-slate-400 border-b border-[#30363d] uppercase font-bold">
                    <tr>
                        <th class="p-4 text-blue-500 italic">Rank</th>
                        <th class="p-4">Ticker</th>
                        <th class="p-4">Earnings Yield (%)</th>
                        <th class="p-4">ROIC (%)</th>
                        <th class="p-4 text-right">M_Score</th>
                    </tr>
                </thead>
                <tbody id="results-grid" class="divide-y divide-[#30363d]">
                    <tr><td colspan="5" class="p-24 text-center text-slate-600 italic uppercase tracking-tighter">Click Execute_Scan to start live data extraction.</td></tr>
                </tbody>
            </table>
        </div>
    </div>

<script>
    // Security Note: Since this key is in a public GitHub repo, anyone can see it. 
    // This is fine for testing, but standard practice is to keep it hidden!
    const API_KEY = "yRjKLFwT3t9TfSXqDPunx2maCHwjOfQh";
    const TICKERS = ["AAPL", "MSFT", "GOOGL", "NVDA", "AMZN", "META", "TSLA", "AVGO", "COST", "ADBE", "ORCL", "NFLX"];

    async function runQuant() {
        const btn = document.getElementById('btn');
        const grid = document.getElementById('results-grid');
        const status = document.getElementById('status-bar');
        const bar = document.getElementById('progress');

        btn.disabled = true;
        btn.innerText = "QUERYING...";
        grid.innerHTML = "";
        
        let stocks = [];

        for (let i = 0; i < TICKERS.length; i++) {
            const symbol = TICKERS[i];
            status.innerText = `> FETCHING_TELEMETRY: ${symbol} (${i + 1}/${TICKERS.length})`;
            bar.style.width = `${((i + 1) / TICKERS.length) * 100}%`;

            try {
                // Using FMP Key Metrics TTM endpoint for accurate Magic Formula data
                const url = `https://financialmodelingprep.com/api/v3/key-metrics-ttm/${symbol}?apikey=${API_KEY}`;
                const response = await fetch(url);
                const data = await response.json();

                if (data && data[0]) {
                    stocks.push({
                        symbol: symbol,
                        yield: (data[0].earningsYieldTTM * 100).toFixed(2),
                        roic: (data[0].roicTTM * 100).toFixed(2),
                        rawYield: data[0].earningsYieldTTM,
                        rawRoic: data[0].roicTTM
                    });
                }
            } catch (e) {
                console.error(`Error on ${symbol}`);
            }
            // Small stagger to visualize the loading process
            await new Promise(r => setTimeout(r, 150));
        }

        // Magic Formula Ranking Engine
        stocks.sort((a, b) => b.rawYield - a.rawYield).forEach((s, i) => s.yRank = i + 1);
        stocks.sort((a, b) => b.rawRoic - a.rawRoic).forEach((s, i) => s.rRank = i + 1);
        stocks.forEach(s => s.score = s.yRank + s.rRank);
        stocks.sort((a, b) => a.score - b.score);

        if (stocks.length === 0) {
            grid.innerHTML = `<tr><td colspan="5" class="p-20 text-center text-red-500 font-bold uppercase">Critical Error: Unable to authenticate with API. Check Key.</td></tr>`;
        } else {
            grid.innerHTML = stocks.map((s, i) => `
                <tr class="hover:bg-blue-500/5 transition-colors">
                    <td class="p-4 font-bold text-blue-500 italic">#${(i+1).toString().padStart(2, '0')}</td>
                    <td class="p-4 text-white font-bold tracking-widest">${s.symbol}</td>
                    <td class="p-4 text-green-400 font-bold">${s.yield}%</td>
                    <td class="p-4 text-purple-400 font-bold">${s.roic}%</td>
                    <td class="p-4 text-right text-white font-black">${s.score}</td>
                </tr>
            `).join('');
        }

        status.innerText = "> SCAN_COMPLETE: ALL_DATA_STABILIZED.";
        btn.disabled = false;
        btn.innerText = "Execute_Scan";
    }
</script>
</body>
</html>
