<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Magic Formula Terminal</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { background-color: #010409; color: #c9d1d9; font-family: sans-serif; }
        .terminal-border { border: 1px solid #30363d; background: #0d1117; }
        @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.5; } }
        .loading { animation: pulse 1.5s infinite; }
    </style>
</head>
<body class="p-6">

    <div class="max-w-4xl mx-auto">
        <header class="border-b border-gray-800 pb-6 mb-8 flex justify-between items-end">
            <div>
                <h1 class="text-3xl font-black text-white italic">MAGIC <span class="text-blue-500">500</span></h1>
                <p id="market-info" class="text-xs text-gray-500 mt-2 font-mono">Market Status: Detecting...</p>
            </div>
            <button onclick="runMagicFormula()" id="syncBtn" class="bg-blue-600 hover:bg-blue-500 text-white px-8 py-3 rounded-lg font-bold transition-all shadow-lg active:scale-95">
                RUN ANALYSIS
            </button>
        </header>

        <div id="progress-container" class="hidden w-full bg-gray-800 h-1 mb-6 rounded-full overflow-hidden">
            <div id="progress-bar" class="bg-blue-500 h-full w-0 transition-all"></div>
        </div>

        <div class="terminal-border rounded-xl overflow-hidden">
            <table class="w-full text-left text-sm">
                <thead class="bg-[#161b22] text-gray-400 text-[10px] uppercase tracking-widest font-bold">
                    <tr>
                        <th class="p-4">Rank</th>
                        <th class="p-4">Ticker</th>
                        <th class="p-4">Data Basis</th>
                        <th class="p-4">Yield</th>
                        <th class="p-4">ROC (ROA)</th>
                        <th class="p-4 text-right">Score</th>
                    </tr>
                </thead>
                <tbody id="table-body" class="divide-y divide-gray-800">
                    <tr>
                        <td colspan="6" class="p-20 text-center text-gray-600 italic">
                            System ready. Click "Run Analysis" to fetch live data.
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>

    <script>
        const tickers = ["AAPL", "MSFT", "GOOGL", "AMZN", "META", "NVDA", "TSLA", "XOM", "JPM", "COST", "ORCL", "NFLX", "ADBE", "CRM", "AMD"];

        async function fetchStock(symbol) {
            // Using AllOrigins Proxy to bypass CORS security blocks
            const proxy = "https://api.allorigins.win/raw?url=";
            const target = `https://query1.finance.yahoo.com/v7/finance/quote?symbols=${symbol}`;
            
            try {
                const response = await fetch(proxy + encodeURIComponent(target));
                const data = await response.json();
                const s = data.quoteResponse.result[0];

                if (!s) return null;

                const isMarketOpen = s.marketState === "REGULAR";
                const basis = isMarketOpen ? "LIVE" : "LAST CLOSE";
                
                // Magic Formula Math
                const yieldVal = s.trailingPE ? (100 / s.trailingPE) : 0;
                // ROA is used as a proxy for ROC on this free endpoint
                const roaVal = s.epsTrailingTwelveMonths ? (s.epsTrailingTwelveMonths / (s.regularMarketPrice * 0.1)) : 0;

                return {
                    symbol,
                    basis,
                    market: s.marketState,
                    yield: yieldVal,
                    roc: roaVal,
                    time: new Date().toLocaleTimeString()
                };
            } catch (e) {
                console.error("Error fetching " + symbol, e);
                return null;
            }
        }

        async function runMagicFormula() {
            const btn = document.getElementById('syncBtn');
            const tbody = document.getElementById('table-body');
            const bar = document.getElementById('progress-bar');
            const pCont = document.getElementById('progress-container');

            btn.disabled = true;
            btn.innerText = "SCRAPING...";
            pCont.classList.remove('hidden');
            tbody.innerHTML = "";

            let results = [];

            for (let i = 0; i < tickers.length; i++) {
                const data = await fetchStock(tickers[i]);
                if (data) results.push(data);
                bar.style.width = ((i + 1) / tickers.length * 100) + "%";
                await new Promise(r => setTimeout(r, 300)); // Rate limit protection
            }

            // --- THE RANKING ENGINE ---
            results.sort((a, b) => b.yield - a.yield);
            results.forEach((s, i) => s.yRank = i + 1);
            results.sort((a, b) => b.roc - a.roc);
            results.forEach((s, i) => s.rRank = i + 1);
            results.forEach(s => s.score = s.yRank + s.rRank);
            results.sort((a, b) => a.score - b.score);

            // Update UI Header
            if(results.length > 0) {
                document.getElementById('market-info').innerText = `Status: ${results[0].market} | Last Sync: ${new Date().toLocaleTimeString()}`;
            }

            // Render Results
            tbody.innerHTML = results.map((s, i) => `
                <tr class="hover:bg-[#161b22] border-b border-gray-800 transition-colors">
                    <td class="p-4 font-bold text-blue-500 font-mono text-lg">#${i + 1}</td>
                    <td class="p-4 font-bold text-white">${s.symbol}</td>
                    <td class="p-4 text-[10px] text-gray-500 font-black uppercase">${s.basis}</td>
                    <td class="p-4 text-green-400 font-mono">${s.yield.toFixed(2)}%</td>
                    <td class="p-4 text-purple-400 font-mono">${(s.roc * 10).toFixed(2)}%</td>
                    <td class="p-4 text-right font-black text-white text-lg">${s.score}</td>
                </tr>
            `).join('');

            btn.disabled = false;
            btn.innerText = "RUN ANALYSIS";
            pCont.classList.add('hidden');
        }
    </script>
</body>
</html>
