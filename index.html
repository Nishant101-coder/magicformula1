<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Quant Terminal | Raw Data Mode</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { background: #050505; color: #d1d5db; font-family: 'Courier New', Courier, monospace; }
        .table-container { background: #0a0a0a; border: 1px solid #262626; border-radius: 4px; }
        .status-msg { font-size: 10px; color: #6b7280; text-transform: uppercase; }
        .real-data { color: #10b981; } /* Green for real data */
        .error-data { color: #ef4444; } /* Red for errors */
    </style>
</head>
<body class="p-8">

    <div class="max-w-5xl mx-auto">
        <div class="flex justify-between items-end mb-8 border-b border-zinc-800 pb-4">
            <div>
                <h1 class="text-white text-xl font-bold tracking-widest">REAL_TIME_QUANT_v2.6</h1>
                <p class="status-msg mt-1">Mode: <span class="text-blue-500">Raw Data Only (No Fallbacks)</span></p>
            </div>
            <button onclick="fetchRawData()" id="runBtn" class="bg-zinc-100 hover:bg-white text-black px-6 py-2 text-xs font-bold transition-all">
                EXECUTE_FETCH
            </button>
        </div>

        <div id="debug-console" class="bg-black border border-zinc-800 p-3 mb-6 text-[10px] h-24 overflow-y-auto font-mono text-zinc-500">
            > System ready. Awaiting command...
        </div>

        <div class="table-container overflow-hidden">
            <table class="w-full text-left text-xs">
                <thead class="bg-zinc-900 text-zinc-400 border-b border-zinc-800">
                    <tr>
                        <th class="p-4">TICKER</th>
                        <th class="p-4">MARKET_STATE</th>
                        <th class="p-4">EARNINGS_YIELD (%)</th>
                        <th class="p-4">PRICE_TO_BOOK</th>
                        <th class="p-4 text-right">TIMESTAMP</th>
                    </tr>
                </thead>
                <tbody id="data-output" class="divide-y divide-zinc-900">
                    <tr><td colspan="5" class="p-12 text-center text-zinc-700 italic">No data loaded. Execute fetch to query Yahoo Finance API.</td></tr>
                </tbody>
            </table>
        </div>
    </div>

<script>
    const tickers = ["AAPL", "MSFT", "GOOGL", "AMZN", "META", "NVDA", "TSLA", "XOM", "JPM", "COST"];

    function log(msg, color = "") {
        const consoleEl = document.getElementById('debug-console');
        consoleEl.innerHTML += `<div style="color:${color}">> ${msg}</div>`;
        consoleEl.scrollTop = consoleEl.scrollHeight;
    }

    async function fetchRawData() {
        const btn = document.getElementById('runBtn');
        const output = document.getElementById('data-output');
        
        btn.disabled = true;
        btn.innerText = "QUERYING...";
        output.innerHTML = "";
        log("Initiating API handshake...", "#3b82f6");

        for (let symbol of tickers) {
            log(`Fetching ${symbol}...`);
            
            // Using a specific proxy that returns the RAW JSON from Yahoo
            const proxy = "https://api.allorigins.win/get?url=";
            const target = `https://query1.finance.yahoo.com/v7/finance/quote?symbols=${symbol}`;
            
            try {
                const response = await fetch(proxy + encodeURIComponent(target));
                const wrapper = await response.json();
                const json = JSON.parse(wrapper.contents);
                const data = json.quoteResponse.result[0];

                if (!data) {
                    throw new Error(`No data returned for ${symbol}`);
                }

                // PROFESSIONAL MATH: No randomizing allowed.
                // Yield = 1 / P/E
                const yieldVal = data.trailingPE ? (100 / data.trailingPE).toFixed(2) : "N/A";
                const pbVal = data.priceToBook ? data.priceToBook.toFixed(2) : "N/A";

                output.innerHTML += `
                    <tr class="hover:bg-zinc-900">
                        <td class="p-4 font-bold text-white">${symbol}</td>
                        <td class="p-4 text-zinc-500">${data.marketState}</td>
                        <td class="p-4 font-mono ${yieldVal !== 'N/A' ? 'real-data' : 'error-data'}">${yieldVal}%</td>
                        <td class="p-4 font-mono text-zinc-400">${pbVal}</td>
                        <td class="p-4 text-right text-[10px] text-zinc-600">${new Date().toLocaleTimeString()}</td>
                    </tr>
                `;
                log(`Success: ${symbol} telemetry received.`, "#10b981");

            } catch (e) {
                log(`Critical Failure on ${symbol}: ${e.message}`, "#ef4444");
                output.innerHTML += `
                    <tr class="bg-red-950/20">
                        <td class="p-4 font-bold text-red-500">${symbol}</td>
                        <td colspan="4" class="p-4 text-red-400 text-[10px] italic">ERROR: Connection throttled or data missing from Yahoo source.</td>
                    </tr>
                `;
            }
            // Wait 500ms to avoid being flagged as a bot
            await new Promise(r => setTimeout(r, 500));
        }

        btn.disabled = false;
        btn.innerText = "EXECUTE_FETCH";
        log("Operation complete.", "#3b82f6");
    }
</script>
</body>
</html>
