<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>QUANT_NODE // STABLE_BUILD</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@500;800&display=swap');
        body { background: #010409; color: #8b949e; font-family: 'JetBrains Mono', monospace; }
        .terminal-panel { background: #0d1117; border: 1px solid #30363d; border-radius: 6px; }
        .loading-bar { height: 2px; background: #238636; transition: width 0.5s ease; }
        .error-glow { color: #f85149; text-shadow: 0 0 5px rgba(248, 81, 73, 0.2); }
    </style>
</head>
<body class="p-4 md:p-10">

    <div class="max-w-5xl mx-auto">
        <header class="flex justify-between items-center mb-8 border-b border-gray-800 pb-6">
            <div>
                <h1 class="text-white text-xl font-bold tracking-tighter uppercase">Magic_Formula_Terminal</h1>
                <p class="text-[9px] text-slate-500 mt-1 uppercase tracking-widest">Protocol: <span class="text-green-500">GENTLE_HANDSHAKE_v2.7</span></p>
            </div>
            <button onclick="runQuant()" id="btn" class="bg-white hover:bg-blue-500 hover:text-white text-black px-8 py-3 rounded text-[10px] font-black transition-all uppercase tracking-widest active:scale-95">Execute_Scan</button>
        </header>

        <div id="status-bar" class="text-[9px] mb-4 text-slate-400 font-bold italic">
            > SYSTEM_READY: AWAITING_COMMAND
        </div>

        <div class="w-full bg-[#161b22] h-[1px] mb-8">
            <div id="progress" class="loading-bar w-0"></div>
        </div>

        <div class="terminal-panel overflow-hidden shadow-2xl">
            <table class="w-full text-left text-[11px]">
                <thead class="bg-[#161b22] text-slate-400 border-b border-[#30363d] uppercase font-bold">
                    <tr>
                        <th class="p-4">Rank</th>
                        <th class="p-4">Ticker</th>
                        <th class="p-4">Earnings Yield (%)</th>
                        <th class="p-4">ROIC (%)</th>
                        <th class="p-4 text-right">M_Score</th>
                    </tr>
                </thead>
                <tbody id="results-grid" class="divide-y divide-[#30363d]">
                    <tr><td colspan="5" class="p-24 text-center text-slate-600 italic uppercase">Click Execute_Scan to begin.</td></tr>
                </tbody>
            </table>
        </div>
    </div>

<script>
    const API_KEY = "yRjKLFwT3t9TfSXqDPunx2maCHwjOfQh";
    // Reduced to 6 companies for the first test to ensure we don't hit the limit
    const TICKERS = ["AAPL", "MSFT", "NVDA", "GOOGL", "AMZN", "META"];

    async function runQuant() {
        const btn = document.getElementById('btn');
        const grid = document.getElementById('results-grid');
        const status = document.getElementById('status-bar');
        const bar = document.getElementById('progress');

        btn.disabled = true;
        btn.innerText = "QUERYING...";
        grid.innerHTML = "";
        
        let stocks = [];

        for (let i = 0; i < TICKERS.length; i++) {
            const symbol = TICKERS[i];
            status.innerText = `> SECURE_FETCH: ${symbol} (${i + 1}/${TICKERS.length})...`;
            bar.style.width = `${((i + 1) / TICKERS.length) * 100}%`;

            try {
                const url = `https://financialmodelingprep.com/api/v3/key-metrics-ttm/${symbol}?apikey=${API_KEY}`;
                const response = await fetch(url);
                
                // If the API says "Too Many Requests" (429), we stop and tell the user
                if (response.status === 429) {
                    throw new Error("API_LIMIT_REACHED (429). Wait 60 seconds.");
                }

                const data = await response.json();

                if (data && data[0]) {
                    stocks.push({
                        symbol: symbol,
                        yield: (data[0].earningsYieldTTM * 100).toFixed(2),
                        roic: (data[0].roicTTM * 100).toFixed(2),
                        rawYield: data[0].earningsYieldTTM,
                        rawRoic: data[0].roicTTM
                    });
                    status.innerHTML = `<span class="text-green-500">> DATA_RECEIVED: ${symbol}</span>`;
                }
            } catch (e) {
                status.innerHTML = `<span class="error-glow">> FAILED: ${symbol} | REASON: ${e.message}</span>`;
            }
            
            // THE "GENTLE" PART: We wait 1.5 seconds between each call
            await new Promise(r => setTimeout(r, 1500));
        }

        // Final Sort & Render
        stocks.sort((a, b) => b.rawYield - a.rawYield).forEach((s, i) => s.yRank = i + 1);
        stocks.sort((a, b) => b.rawRoic - a.rawRoic).forEach((s, i) => s.rRank = i + 1);
        stocks.forEach(s => s.score = s.yRank + s.rRank);
        stocks.sort((a, b) => a.score - b.score);

        if (stocks.length === 0) {
            grid.innerHTML = `<tr><td colspan="5" class="p-20 text-center error-glow font-bold uppercase">Critical Data Block. Use F12 to check Network Console.</td></tr>`;
        } else {
            grid.innerHTML = stocks.map((s, i) => `
                <tr class="hover:bg-blue-500/5">
                    <td class="p-4 font-bold text-blue-500 italic">#${(i+1).toString().padStart(2, '0')}</td>
                    <td class="p-4 text-white font-bold tracking-widest">${s.symbol}</td>
                    <td class="p-4 text-green-400 font-bold">${s.yield}%</td>
                    <td class="p-4 text-purple-400 font-bold">${s.roic}%</td>
                    <td class="p-4 text-right text-white font-black">${s.score}</td>
                </tr>
            `).join('');
        }

        status.innerText = "> SCAN_COMPLETE.";
        btn.disabled = false;
        btn.innerText = "Execute_Scan";
    }
</script>
</body>
</html>
