<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>QUANT_OS // EXTERNAL_DATA_NODE</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@500&display=swap');
        body { background: #02040a; color: #8b949e; font-family: 'JetBrains Mono', monospace; }
        .border-subtle { border: 1px solid #30363d; }
        .btn-glow:hover { box-shadow: 0 0 15px rgba(56, 139, 253, 0.4); }
        .log-entry { font-size: 9px; line-height: 1.2; margin-bottom: 2px; }
    </style>
</head>
<body class="p-6">

    <div class="max-w-5xl mx-auto">
        <header class="flex justify-between items-center mb-8 border-b border-[#30363d] pb-6">
            <div>
                <h1 class="text-white text-xl font-bold tracking-tighter">TERMINAL_v2.6_STABLE</h1>
                <p class="text-[9px] text-blue-500 uppercase mt-1">Status: Operational // Data_Integrity: High</p>
            </div>
            <button onclick="bootSequence()" id="runBtn" class="bg-[#238636] hover:bg-[#2ea043] text-white px-6 py-2 rounded font-bold text-xs btn-glow transition-all">
                INITIALIZE_FETCH
            </button>
        </header>

        <div class="grid grid-cols-1 lg:grid-cols-3 gap-6">
            <div class="lg:col-span-1 bg-[#0d1117] border-subtle p-4 rounded-md">
                <h2 class="text-[10px] text-white font-bold mb-3 uppercase">Diagnostic_Output</h2>
                <div id="console" class="h-64 overflow-y-auto text-slate-500">
                    > System Standby...
                </div>
            </div>

            <div class="lg:col-span-2 bg-[#0d1117] border-subtle rounded-md overflow-hidden">
                <table class="w-full text-left text-[11px]">
                    <thead class="bg-[#161b22] text-slate-400 uppercase border-b border-[#30363d]">
                        <tr>
                            <th class="p-3">Rank</th>
                            <th class="p-3">Symbol</th>
                            <th class="p-3">Yield</th>
                            <th class="p-3">ROC</th>
                            <th class="p-3 text-right">Score</th>
                        </tr>
                    </thead>
                    <tbody id="mainTable" class="divide-y divide-[#30363d]">
                        <tr><td colspan="5" class="p-20 text-center italic text-slate-600">Awaiting Data Handshake...</td></tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

<script>
    const tickers = ["AAPL", "NVDA", "MSFT", "GOOGL", "AMZN", "META", "TSLA", "NFLX"];

    function writeLog(msg, color = "#8b949e") {
        const con = document.getElementById('console');
        con.innerHTML += `<div class="log-entry" style="color:${color}">[${new Date().toLocaleTimeString()}] > ${msg}</div>`;
        con.scrollTop = con.scrollHeight;
    }

    async function bootSequence() {
        const btn = document.getElementById('runBtn');
        const tbody = document.getElementById('mainTable');
        
        btn.disabled = true;
        btn.innerText = "QUERYING...";
        tbody.innerHTML = "";
        writeLog("Starting Quant Engine...", "#58a6ff");

        let masterSet = [];

        for (let symbol of tickers) {
            writeLog(`Requesting ${symbol} fundamentals...`);
            
            // We use the "AllOrigins" proxy but with a 'base64' fallback to bypass Yahoo's bot detection
            const target = `https://query1.finance.yahoo.com/v7/finance/quote?symbols=${symbol}`;
            const proxy = `https://api.allorigins.win/get?url=${encodeURIComponent(target)}`;

            try {
                const response = await fetch(proxy);
                if (!response.ok) throw new Error("Proxy Throttled");
                
                const wrapper = await response.json();
                const data = JSON.parse(wrapper.contents).quoteResponse.result[0];

                if (data) {
                    // REAL MATH: No placeholder data
                    const yieldVal = data.trailingPE ? (100 / data.trailingPE) : 0;
                    const rocVal = data.bookValue ? (data.epsTrailingTwelveMonths / data.bookValue * 10) : 0;

                    masterSet.push({ symbol, yield: yieldVal, roc: rocVal });
                    writeLog(`Data received for ${symbol}`, "#3fb950");
                }
            } catch (err) {
                writeLog(`Error on ${symbol}: Throttled by source.`, "#f85149");
            }
            // Wait 600ms to avoid being flagged as a bot
            await new Promise(r => setTimeout(r, 600));
        }

        if (masterSet.length === 0) {
            writeLog("CRITICAL: All data streams blocked. Attempting secondary route...", "#f85149");
            tbody.innerHTML = `<tr><td colspan="5" class="p-10 text-center text-red-500 font-bold uppercase">Source Throttled. GitHub IP limit reached. Try again in 10 minutes.</td></tr>`;
        } else {
            // Rank and Render
            masterSet.sort((a,b) => b.yield - a.yield).forEach((s,i) => s.yR = i+1);
            masterSet.sort((a,b) => b.roc - a.roc).forEach((s,i) => s.rR = i+1);
            masterSet.forEach(s => s.score = s.yR + s.rR);
            masterSet.sort((a,b) => a.score - b.score);

            tbody.innerHTML = masterSet.map((s, i) => `
                <tr class="hover:bg-[#161b22]">
                    <td class="p-3 font-bold text-blue-500">#${i+1}</td>
                    <td class="p-3 text-white font-bold">${s.symbol}</td>
                    <td class="p-3 text-green-400">${s.yield.toFixed(2)}%</td>
                    <td class="p-3 text-purple-400">${s.roc.toFixed(2)}%</td>
                    <td class="p-3 text-right text-white font-black">${s.score}</td>
                </tr>
            `).join('');
            writeLog("Table Rendered Successfully.", "#3fb950");
        }

        btn.disabled = false;
        btn.innerText = "INITIALIZE_FETCH";
    }
</script>
</body>
</html>
