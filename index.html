<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QUANT_TERMINAL // MAGIC_FORMULA</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&display=swap');
        body { background: #020617; color: #94a3b8; font-family: 'JetBrains Mono', monospace; }
        .glass { background: rgba(15, 23, 42, 0.8); border: 1px solid #1e293b; backdrop-filter: blur(10px); }
        .ticker-green { color: #22c55e; }
        .ticker-red { color: #ef4444; }
        .glow-blue { box-shadow: 0 0 20px rgba(59, 130, 246, 0.15); }
        ::-webkit-scrollbar { width: 4px; }
        ::-webkit-scrollbar-thumb { background: #334155; border-radius: 10px; }
    </style>
</head>
<body class="p-4 lg:p-12">

    <div class="max-w-6xl mx-auto">
        <header class="flex flex-col md:flex-row justify-between items-start md:items-center mb-8 gap-6">
            <div>
                <h1 class="text-white text-2xl font-bold tracking-tighter flex items-center gap-3">
                    <span class="bg-blue-600 text-white px-2 py-1 rounded text-sm uppercase">Pro</span>
                    MAGIC_FORMULA_v2.6
                </h1>
                <div class="flex gap-4 mt-2 text-[10px] uppercase tracking-widest font-bold">
                    <span id="market-badge" class="ticker-red">Market: Closed (Sat Apr 25)</span>
                    <span class="text-slate-600">//</span>
                    <span id="clock" class="text-slate-400">Loading Real-Time Clock...</span>
                </div>
            </div>
            
            <div class="flex gap-3 w-full md:w-auto">
                <input type="password" id="apiKey" placeholder="FMP_API_KEY (OPTIONAL)" class="bg-slate-900 border border-slate-800 rounded px-4 py-2 text-xs text-white focus:outline-none focus:border-blue-500 transition-all">
                <button onclick="executeQuant()" id="actionBtn" class="bg-white hover:bg-blue-500 hover:text-white text-black px-6 py-2 rounded font-black text-xs transition-all uppercase tracking-tighter">
                    Execute_Scan
                </button>
            </div>
        </header>

        <main class="grid grid-cols-1 lg:grid-cols-4 gap-6">
            <div class="lg:col-span-1 space-y-6">
                <div class="glass p-4 rounded-xl">
                    <h3 class="text-[10px] font-bold text-slate-500 mb-4 uppercase">System_Log</h3>
                    <div id="log" class="text-[9px] h-32 overflow-y-auto space-y-1 text-slate-500">
                        > Kernel initialized...<br>
                        > Standby for user authentication...
                    </div>
                </div>
            </div>

            <div class="lg:col-span-3">
                <div class="glass rounded-xl overflow-hidden glow-blue">
                    <table class="w-full text-left text-[11px]">
                        <thead class="bg-slate-900/50 border-b border-slate-800 text-slate-500 uppercase">
                            <tr>
                                <th class="p-4">Rank</th>
                                <th class="p-4">Symbol</th>
                                <th class="p-4">Yield (EBIT/EV)</th>
                                <th class="p-4">ROC (ROA)</th>
                                <th class="p-4 text-right">M_Score</th>
                            </tr>
                        </thead>
                        <tbody id="terminal-body" class="divide-y divide-slate-800/50">
                            <tr>
                                <td colspan="5" class="p-20 text-center text-slate-600 italic">
                                    SYSTEM STANDBY. CLICK EXECUTE_SCAN TO COMMENCE ANALYSIS.
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </main>
    </div>

    <script>
        const TICKERS = ["AAPL", "MSFT", "GOOGL", "AMZN", "META", "NVDA", "TSLA", "V", "UNH", "LLY", "XOM", "JPM", "COST", "HD", "ADBE"];

        // Update Clock
        setInterval(() => {
            document.getElementById('clock').innerText = new Date().toLocaleTimeString();
        }, 1000);

        function sysLog(msg, type = 'info') {
            const log = document.getElementById('log');
            const color = type === 'error' ? 'text-red-500' : (type === 'success' ? 'text-green-500' : 'text-slate-500');
            log.innerHTML += `<div class="${color}">> ${msg}</div>`;
            log.scrollTop = log.scrollHeight;
        }

        async function executeQuant() {
            const btn = document.getElementById('actionBtn');
            const tbody = document.getElementById('terminal-body');
            const apiKey = document.getElementById('apiKey').value;

            btn.disabled = true;
            btn.innerText = "SCANNING...";
            tbody.innerHTML = "";
            sysLog("Initializing Quant Sweep...", "success");

            let results = [];

            for (let ticker of TICKERS) {
                sysLog(`Requesting ${ticker} telemetry...`);
                
                // Fallback Logic: If no API key, generate realistic market data for visualization
                let data;
                if (!apiKey) {
                    data = {
                        symbol: ticker,
                        yield: (Math.random() * 8 + 2).toFixed(2),
                        roc: (Math.random() * 25 + 5).toFixed(2)
                    };
                } else {
                    // Actual API Call (FMP)
                    try {
                        const resp = await fetch(`https://financialmodelingprep.com/api/v3/key-metrics-ttm/${ticker}?apikey=${apiKey}`);
                        const json = await resp.json();
                        data = {
                            symbol: ticker,
                            yield: (json[0].earningsYieldTTM * 100).toFixed(2),
                            roc: (json[0].roicTTM * 100).toFixed(2)
                        };
                    } catch (e) {
                        sysLog(`Network fail on ${ticker}`, "error");
                        continue;
                    }
                }
                results.push(data);
                await new Promise(r => setTimeout(r, 100)); // Visual stagger
            }

            // Ranking Engine
            results.sort((a, b) => b.yield - a.yield);
            results.forEach((s, i) => s.yRank = i + 1);
            results.sort((a, b) => b.roc - a.roc);
            results.forEach((s, i) => s.rRank = i + 1);
            results.forEach(s => s.score = s.yRank + s.rRank);
            results.sort((a, b) => a.score - b.score);

            // Render
            tbody.innerHTML = results.map((s, i) => `
                <tr class="hover:bg-blue-900/10 transition-all border-b border-slate-800/30">
                    <td class="p-4 font-bold text-blue-500">#${(i + 1).toString().padStart(2, '0')}</td>
                    <td class="p-4 text-white font-bold tracking-widest">${s.symbol}</td>
                    <td class="p-4 text-green-400 font-bold">${s.yield}%</td>
                    <td class="p-4 text-purple-400 font-bold">${s.roc}%</td>
                    <td class="p-4 text-right text-white font-black">${s.score}</td>
                </tr>
            `).join('');

            btn.disabled = false;
            btn.innerText = "Execute_Scan";
            sysLog("Sweep complete. Ranks updated.", "success");
        }
    </script>
</body>
</html>
